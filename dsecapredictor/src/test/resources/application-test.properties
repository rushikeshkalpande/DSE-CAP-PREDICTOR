# Test Configuration for DSE College Predictor Integration Tests

# Test Data Configuration
dse.predictor.csv-file-path=src/test/resources/test-data/integration-test-data.csv
dse.predictor.max-recommendations=10
dse.predictor.percentage-range=10.0
dse.predictor.enable-detailed-logging=true
dse.predictor.min-year=2019

# Test Application Display Configuration
dse.predictor.app-title=DSE College Predictor (Test Mode)
dse.predictor.app-version=1.0.0-TEST
dse.predictor.show-welcome-message=false

# Test Logging Configuration
logging.level.com.dsecap.predictor=DEBUG
logging.level.org.springframework=WARN
logging.level.org.apache.maven=ERROR
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Disable file logging for tests
logging.file.name=
logging.file.max-size=
logging.file.max-history=

# Spring Boot Test Configuration
spring.main.banner-mode=off
spring.output.ansi.enabled=never
spring.main.web-application-type=none

# Test-specific settings
spring.test.mockmvc.print=none