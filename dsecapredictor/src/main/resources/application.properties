spring.application.name=DSE CAP Predictor

# DSE Predictor Configuration
dse.predictor.csv-file-path=src/main/resources/data/sample-cutoff-data.csv
dse.predictor.max-recommendations=15
dse.predictor.percentage-range=10.0
dse.predictor.enable-detailed-logging=false
dse.predictor.min-year=2019

# Performance Monitoring Configuration
dse.predictor.performance.enable-monitoring=true
dse.predictor.performance.log-memory-usage=true
dse.predictor.performance.log-operation-times=true
dse.predictor.performance.memory-warning-threshold=85

# Cache Configuration
dse.predictor.cache.enable-caching=true
dse.predictor.cache.max-size=1000
dse.predictor.cache.ttl-minutes=5

# Application Display Configuration
dse.predictor.app-title=DSE College Predictor
dse.predictor.app-version=1.0.0
dse.predictor.show-welcome-message=true

# Logging Configuration
logging.level.com.dsecap.predictor=INFO
logging.level.org.springframework=WARN
logging.level.org.apache.maven=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Console Output Configuration
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/dse-predictor.log
logging.file.max-size=10MB
logging.file.max-history=5

# Spring Boot Configuration
spring.main.banner-mode=off
spring.output.ansi.enabled=detect
