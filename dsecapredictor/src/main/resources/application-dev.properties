# Development Profile Configuration
# Use this profile for development: mvn spring-boot:run -Dspring-boot.run.profiles=dev

# Enhanced logging for development
logging.level.com.dsecap.predictor=DEBUG
dse.predictor.enable-detailed-logging=true

# Development-specific settings
dse.predictor.show-welcome-message=true
dse.predictor.max-recommendations=20

# Console output with colors for better readability
spring.output.ansi.enabled=always
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5level) %clr([%thread]){magenta} %clr(%logger{36}){cyan} - %msg%n