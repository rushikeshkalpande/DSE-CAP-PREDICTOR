# Production Profile Configuration
# Use this profile for production: java -jar app.jar --spring.profiles.active=prod

# Minimal logging for production
logging.level.com.dsecap.predictor=WARN
logging.level.org.springframework=ERROR
dse.predictor.enable-detailed-logging=false

# Production-specific settings
dse.predictor.show-welcome-message=false
dse.predictor.csv-file-path=data/cutoff-data.csv

# File logging only in production
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level - %msg%n
logging.file.name=logs/dse-predictor-prod.log